domain_randomization:
  enabled: true
  # Phase-1 wrist smoke only. Do not reuse for v3 formal collection.
  seed: 59
  camera:
    scene_camera:
      pos_noise: [0.0, 0.0]
      rot_noise: [0.0, 0.0]
  object:
    sphere_initial_z: 0.03
    mass_range: [0.04, 0.04]
    friction_range: [2.2, 2.2]
