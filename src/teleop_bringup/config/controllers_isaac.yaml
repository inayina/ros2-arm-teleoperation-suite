# Isaac-specific ros2_control profile.
#
# Isaac publishes Panda state over the external ROS bridge at roughly 25-45 Hz
# on the validated laptop. Reusing the MuJoCo 1 kHz/high-stiffness profile
# makes the delayed effort loop underdamped. Keep MuJoCo on controllers.yaml;
# this profile deliberately favors bounded E2/E3 execution over bandwidth.
controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    forward_effort_controller:
      type: forward_command_controller/ForwardCommandController

    cartesian_impedance_controller:
      type: teleop_controllers/CartesianImpedanceController

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

forward_effort_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    interface_name: effort

cartesian_impedance_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7

    cartesian_stiffness: [40.0, 40.0, 40.0, 2.0, 2.0, 2.0]
    cartesian_damping: [8.0, 8.0, 8.0, 1.5, 1.5, 1.5]
    contact_threshold_n: 5.0
    stiffness_scale: 50.0

    joint_stiffness: [8.0, 8.0, 6.0, 5.0, 2.0, 2.0, 1.5]
    joint_damping: [2.5, 2.5, 2.0, 1.8, 1.0, 1.0, 0.8]

    max_torque_nm: [12.0, 12.0, 12.0, 10.0, 4.0, 4.0, 4.0]
    max_cartesian_error_m: 0.02

joint_trajectory_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
